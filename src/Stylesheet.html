<style>
  :root {
    --yellow: #FFD93B;
    --yellow-soft: #FFF6CC;
    --denim: #2F5DA8;
    --denim-dark: #234a87;
    --ink: #222222;
    --muted: #555555;
    --white: #ffffff;
    --ok: #1f8a4c;
    --warn: #c0392b;
    --radius: 20px;
    --shadow: 5px 5px 0 var(--ink);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    background: var(--yellow);
    background-image: radial-gradient(rgba(255,255,255,.35) 2px, transparent 2px);
    background-size: 22px 22px;
    color: var(--ink);
    min-height: 100vh;
    padding: 0 16px 40px;
  }
  h1, h2, .tab, .btn, .course { font-family: 'Jua', 'Noto Sans KR', sans-serif; font-weight: 400; }
  h1 { margin: 0; font-size: 26px; line-height: 1.25; }
  h2 { margin: 18px 0 10px; font-size: 19px; }
  .card h2:first-child { margin-top: 0; }

  .top { max-width: 720px; margin: 0 auto; display: flex; gap: 12px; align-items: center; padding: 20px 0 12px; }
  .course { color: var(--denim); font-size: 16px; }
  .mascot svg { display: block; }
  .mascot.happy .mouth { d: path("M42 72 q14 16 28 0"); }
  .mascot.bounce { animation: hop .6s ease-in-out infinite alternate; }

  .tabs { max-width: 720px; margin: 0 auto 14px; display: flex; gap: 8px; }
  .tab {
    flex: 1; padding: 12px; font-size: 18px; cursor: pointer;
    background: var(--white); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px; box-shadow: 3px 3px 0 var(--ink);
  }
  .tab.on { background: var(--denim); color: var(--white); }
  .tab-link { flex: 0 0 auto; width: 56px; text-decoration: none; text-align: center; display: grid; place-items: center; }

  main { max-width: 720px; margin: 0 auto; }
  .card {
    background: var(--white); border: 3px solid var(--ink); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px; margin-bottom: 18px;
  }
  .guide { background: var(--yellow-soft); line-height: 1.7; white-space: pre-wrap; }

  label { display: block; font-weight: 700; margin: 12px 0 4px; font-size: 15px; }
  input, textarea {
    display: block; width: 100%; margin-top: 6px; font: inherit; font-weight: 400; font-size: 16px;
    padding: 11px 13px; border: 2px solid var(--ink); border-radius: 14px; background: #fffdf3;
  }
  input:focus, textarea:focus { outline: 3px solid var(--denim); outline-offset: 1px; }
  textarea { resize: vertical; line-height: 1.6; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt { color: var(--muted); font-weight: 400; font-size: 13px; }
  .req { background: var(--denim); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 999px; vertical-align: middle; }
  .count { display: block; text-align: right; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }

  .stages { display: grid; gap: 10px; }
  .stage {
    display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
    padding: 12px 14px; background: #fffdf3; border: 2px solid var(--ink); border-radius: 16px;
    font: inherit; cursor: pointer; color: var(--ink);
  }
  .stage .num {
    flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: var(--yellow); border: 2px solid var(--ink); font-family: 'Jua'; font-size: 17px;
  }
  .stage .nm { font-weight: 700; }
  .stage .dl { font-size: 13px; color: var(--muted); }
  .stage .badge { margin-left: auto; font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 2px solid var(--ink); white-space: nowrap; }
  .stage.sel { background: var(--denim); color: #fff; }
  .stage.sel .dl { color: #dfe8ff; }
  .stage:disabled { opacity: .5; cursor: not-allowed; }
  .stage-desc { margin: 12px 0 0; padding: 10px 14px; background: var(--yellow-soft); border-radius: 12px; line-height: 1.6; }
  .stage-desc:empty { display: none; }

  .drop {
    margin-top: 12px; border: 3px dashed var(--denim); border-radius: 18px; padding: 22px;
    text-align: center; cursor: pointer; background: #f4f8ff; transition: transform .1s;
  }
  .drop.over { background: #e3edff; transform: scale(1.01); }
  .drop .big { font-size: 32px; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .picked { margin-top: 10px; padding: 10px 14px; background: var(--yellow-soft); border: 2px solid var(--ink); border-radius: 12px; display: flex; gap: 8px; align-items: center; }
  .picked button { margin-left: auto; }

  .rubric-peek { margin-top: 18px; border: 2px solid var(--ink); border-radius: 14px; padding: 10px 14px; background: #fffdf3; }
  .rubric-peek summary { cursor: pointer; font-weight: 700; }

  table.t { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
  table.t th, table.t td { border: 2px solid var(--ink); padding: 7px 9px; text-align: left; vertical-align: top; }
  table.t th { background: var(--yellow); white-space: nowrap; }

  .btn {
    display: inline-block; text-decoration: none; text-align: center;
    padding: 11px 22px; font-size: 17px; cursor: pointer; color: var(--ink);
    background: var(--white); border: 3px solid var(--ink); border-radius: 999px; box-shadow: 3px 3px 0 var(--ink);
    transition: transform .08s, box-shadow .08s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 4px 5px 0 var(--ink); }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .btn.primary { background: var(--denim); color: #fff; }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn.small { padding: 6px 14px; font-size: 15px; }
  .big-btn { width: 100%; margin-top: 16px; font-size: 19px; }
  .err { color: var(--warn); font-weight: 700; margin-top: 10px; white-space: pre-wrap; }
  .err:empty { display: none; }
  .tiny { font-size: 12px; color: var(--muted); text-align: center; margin: 8px 0 0; }

  /* 진행 타임라인 */
  .timeline { display: flex; gap: 6px; margin: 6px 0 4px; }
  .tl { flex: 1; text-align: center; }
  .tl .dot {
    width: 40px; height: 40px; margin: 0 auto 6px; border-radius: 50%; display: grid; place-items: center;
    border: 3px solid var(--ink); background: #eee; font-size: 18px;
  }
  .tl.sub .dot { background: var(--yellow); }
  .tl.fb .dot { background: var(--denim); color: #fff; }
  .tl .lb { font-size: 12px; line-height: 1.3; }
  .tl .sc { font-family: 'Jua'; font-size: 15px; color: var(--denim); }
  .growth { margin-top: 14px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
  .bar-row .lb { width: 34%; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { flex: 1; height: 16px; background: #eee; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--denim); border-radius: 999px; }
  .bar-row .v { width: 64px; text-align: right; font-weight: 700; }

  .sub-card .head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .sub-card .when { color: var(--muted); font-size: 13px; }
  .state { margin-left: auto; padding: 4px 12px; border-radius: 999px; border: 2px solid var(--ink); font-size: 13px; font-weight: 700; }
  .state.reading { background: #eee; }
  .state.writing { background: var(--yellow-soft); }
  .state.arrived { background: var(--denim); color: #fff; }
  .kv { margin: 10px 0 0; font-size: 14px; line-height: 1.6; }
  .kv dt { font-weight: 700; margin-top: 6px; }
  .kv dd { margin: 0; white-space: pre-wrap; }
  .fb-box { margin-top: 12px; padding: 12px 14px; background: var(--yellow-soft); border: 2px solid var(--ink); border-radius: 14px; }
  .fb-box .total { font-family: 'Jua'; font-size: 22px; color: var(--denim); }
  .next { white-space: pre-wrap; line-height: 1.6; }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; z-index: 10; }
  .modal[hidden] { display: none; }
  .sheet {
    background: #fff; border: 3px solid var(--ink); border-radius: var(--radius); box-shadow: var(--shadow);
    width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; padding: 20px;
  }
  .sheet.wide { max-width: 900px; padding: 12px; }
  .sheet.center { text-align: center; }
  .btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  .sheet.center .btns { justify-content: center; }
  .done-icon { font-size: 56px; animation: pop .5s ease-out; }
  .pdf-bar { display: flex; gap: 8px; align-items: center; position: sticky; top: -12px; background: #fff; padding: 6px 0 10px; z-index: 1; }
  .grow { flex: 1; }
  .pdf-pages { min-height: 200px; }
  .pdf-pages canvas { display: block; width: 100%; height: auto; margin: 0 auto 10px; border: 2px solid var(--ink); border-radius: 8px; }

  .loading { position: fixed; inset: 0; background: rgba(255,217,59,.85); display: grid; place-content: center; text-align: center; z-index: 20; font-family: 'Jua'; font-size: 20px; }
  .loading[hidden] { display: none; }
  .bounce { font-size: 48px; animation: hop .45s ease-in-out infinite alternate; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; width: 100%; height: 100%; }
  .teacher-link { color: var(--ink); }
  footer { text-align: center; font-size: 12px; color: var(--ink); opacity: .7; margin-top: 20px; }

  @keyframes hop { from { transform: translateY(0); } to { transform: translateY(-12px); } }
  @keyframes pop { 0% { transform: scale(.3); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @media (max-width: 480px) {
    h1 { font-size: 22px; }
    .row2 { grid-template-columns: 1fr; }
    .card { padding: 16px; }
    .bar-row .lb { width: 40%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
